# Slack Community Agent — yerel / sunucu orkestasyonu
#
# Önkoşul: proje kökünde Slack + Postgres dahil tam `.env` (bkz. `.env.template`).
# Konteynerler `x-db-env` ile postgres servisine baglanir (sifre: .env veya varsayilan `postgres`).
#
# Varsayılan: postgres + migrate + challenge (tek Socket; özet + İngilizce + özellik talebi handler'ları içeride) + event (scheduler).
# Admin kanalı: event bir mesaj + challenge konteyneri dört blok (çekirdek challenge + özet + İngilizce + özellik talebi).
# Aynı Slack app token ile ikinci bir Socket Mode süreci çalıştırmayın.
#
# Sadece özellik talebi süreci (challenge yok): docker compose --profile feature-standalone up -d
# English / Summary (ayri Socket — challenge ile birlikte calistirmayin):
#   docker compose --profile english-standalone up -d
#   docker compose --profile summary-standalone up -d
#
# Komutlar:
#   docker compose up -d
#   docker compose logs -f challenge
#   docker compose down

name: slack-community-agent

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-slack_community_agent}

services:
  postgres:
    image: pgvector/pgvector:pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-slack_community_agent}
    ports:
      # Yerel araçlar (IDE, pgAdmin, alembic host’tan): localhost:5432. Makinede başka Postgres varsa çakışır → "5433:5432" yapın.
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-slack_community_agent}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: services/challenge_service/Dockerfile
    env_file:
      - .env
    environment:
      <<: *db-env
    working_dir: /app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  challenge:
    build:
      context: .
      dockerfile: services/challenge_service/Dockerfile
    env_file:
      - .env
    environment:
      <<: *db-env
      NUMBA_CACHE_DIR: /tmp/numba-cache
    volumes:
      # Host projedeki logs/ ile senkron — dosya handler'ları /app/logs/<servis>/ yazar
      - ./logs:/app/logs
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  event:
    build:
      context: .
      dockerfile: services/event_service/Dockerfile
    env_file:
      - .env
    environment:
      <<: *db-env
    # Dockerfile --socket verir; challenge zaten Socket tuttugu icin burada sadece scheduler (+ envanter handler kaydi).
    command: ["python", "-m", "services.event_service"]
    volumes:
      # Host projedeki logs/ ile senkron — dosya handler'ları /app/logs/<servis>/ yazar
      - ./logs:/app/logs
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Challenge ile ayni anda calistirma: iki process ayri Socket Mode acar (Slack app bunu desteklemez).
  feature-request:
    profiles: ["feature-standalone"]
    build:
      context: .
      dockerfile: services/feature_request_service/Dockerfile
    env_file:
      - .env
    environment:
      <<: *db-env
      NUMBA_CACHE_DIR: /tmp/numba-cache
    volumes:
      # Host projedeki logs/ ile senkron — dosya handler'ları /app/logs/<servis>/ yazar
      - ./logs:/app/logs
      - hf_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  english:
    profiles: ["english-standalone"]
    build:
      context: .
      dockerfile: services/english_service/Dockerfile
    env_file:
      - .env
    environment:
      <<: *db-env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  summary:
    profiles: ["summary-standalone"]
    build:
      context: .
      dockerfile: services/summary_service/Dockerfile
    env_file:
      - .env
    environment:
      <<: *db-env
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  hf_cache:
